app = "cs2-multiplayer"
primary_region = "fra"

[build]
  image = "ghcr.io/balintsoos/cs16-web-server:latest"

[http_service]
  internal_port = 27016
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

